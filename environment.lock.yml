name: computational-economics-lock
# Deterministic-execution lock (WP-12).
#
# Fully pinned environment for the standing quality gates (structural audit,
# pytest suite, ruff, black) and for top-to-bottom execution of the
# dependency-light deterministic lectures. Versions are the combination
# verified on the development machine; every pin is exact so that
# top-to-bottom runs reproduce bit-for-bit where the notebooks are seeded.
#
# Scope note: this lock intentionally covers the deterministic core. Lectures
# that require heavy or networked optional stacks (torch, tensorflow,
# geopandas, prophet, API keys, ...) are exercised by their own optional
# environments, not by the deterministic CI job.
#
# CI consumes these pins by extracting the `pip:` block (PyYAML is
# preinstalled on GitHub-hosted runners); conda users can create the env
# directly:  conda env create -f environment.lock.yml
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.5.2
      - scipy==1.18.0
      - numba==0.67.0
      - matplotlib==3.11.1
      - pandas==2.3.3
      - nbformat==5.10.4
      - nbclient==0.10.2
      - nbconvert==7.16.4
      - ipykernel==6.29.5
      - pytest==9.1.1
      - ruff==0.16.4
      - black==26.5.1
