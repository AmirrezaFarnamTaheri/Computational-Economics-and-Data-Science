[project]
name = "computational-economics-and-data-science"
version = "1.0.0"
description = "A comprehensive course in computational economics and data science"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
# Notebook linting is tracked separately (audit Phase 7: code quality pass
# over all curriculum notebooks); lint only .py sources for now, matching Black.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Do not globally hide deprecations: course code should surface ecosystem drift.
# Narrow third-party warning filters belong next to the specific test that
# requires them, with an explanatory comment and expiry condition.
